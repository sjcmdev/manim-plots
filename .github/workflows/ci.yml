name: CI

on:
  push:
    branches: [main, dev, "task/**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        manim: ["0.21.0", "0.22.0"]
    name: py${{ matrix.python }} / manim ${{ matrix.manim }}
    steps:
      - uses: actions/checkout@v4
      # pycairo ships no Linux wheels, so Manim builds it from source.
      - run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev pkg-config
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python ${{ matrix.python }}
      # The lock pins the target (0.21.0); the other supported version is swapped in on top.
      - run: uv pip install --python .venv/bin/python "manim==${{ matrix.manim }}"
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest
